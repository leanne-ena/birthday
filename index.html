<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Date Game 💜</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f3e8ff, #ede9fe);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* SHAKE */
.shake {
  animation: shake 0.5s;
}
@keyframes shake {
  0% { transform: translate(2px, 2px); }
  50% { transform: translate(-4px, -2px); }
  100% { transform: translate(2px, 2px); }
}

/* ERROR MODE */
.error-mode {
  background: #e9e5f5 !important;
  filter: grayscale(100%);
}

/* CARD */
.card {
  width: 90%;
  max-width: 420px;
  background: #faf5ff;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
}

.summary-card {
  background: linear-gradient(135deg, #ede9fe, #f5f3ff);
  border-radius: 16px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2);
  text-align: left;
  font-size: 16px;
  line-height: 1.6;
}


/* TEXT */
h2 { color: #8b5cf6; }

/* BUTTON */
.option-btn {
  width: 100%;
  margin: 10px 0;
  padding: 15px;
  border-radius: 15px;
  border: none;
  background: #a78bfa;
  color: white;
  font-size: 16px;
  transition: 0.3s;
}
.option-btn:hover {
  background: #8b5cf6;
}

/* CALENDAR */
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.day {
  padding: 12px;
  border-radius: 12px;
  background: #f3e8ff;
  cursor: pointer;
  transition: 0.2s;
}
.day:hover {
  background: #ddd6fe;
}
.day.selected {
  background: #8b5cf6;
  color: white;
}
.day.empty {
  background: transparent;
}

/* SMALL TEXT */
.small {
  font-size: 13px;
  color: #888;
  margin-top: 8px;
}

/* DANCE */
.dance-avatar {
  font-size: 60px;
  margin: 20px 0;
  animation: dance 0.6s infinite alternate;
}
@keyframes dance {
  0% { transform: rotate(-10deg); }
  100% { transform: rotate(10deg) translateY(-10px); }
}

/* 📱 Mobile optimization (iPhone fit) */
@media (max-width: 480px) {

  .card {
    width: 75%;
    padding: 18px; /* smaller spacing */
    border-radius: 16px;
  }

  h2 {
    font-size: 20px; /* slightly smaller */
  }

  p {
    font-size: 14px;
  }

  .option-btn {
    padding: 12px;
    font-size: 14px;
    border-radius: 12px;
  }

  .day {
    padding: 8px;
    font-size: 12px;
  }

  .dance-avatar {
    font-size: 48px;
  }

  .summary-card {
    padding: 14px;
    font-size: 14px;
  }
}

.custom-input {
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 14px;
  background: #f3e8ff;
  box-sizing: border-box;
}

.details-link {
  display: inline-block;
  margin: 10px 0;
  color: #8b5cf6;
  font-weight: bold;
}


.details-link:hover {
  text-decoration: underline;
}


</style>
</head>

<body>

<div class="card">

<!-- START -->
<div id="start">
  <h2>Hi love, happy birth month! 💜</h2>
  <p>Will you go out with me to celebrate your birthday? 🥺</p>
  <button class="option-btn" id="yesBtn" onclick="sayYes()">YES</button>
  <button class="option-btn" id="noBtn" onclick="sayNo()">NO</button>
</div>

<!-- EARLY CELEBRATION -->
<div id="earlyCelebrate" style="display:none;">
  <h2>AWWW YOU SAID YES 💜🥺</h2>
  <div class="dance-avatar">😂</div>

  <button class="option-btn" onclick="continueGame()">
    now that you said yes, let me give you a few options
  </button>
</div>

<!-- ERROR -->
<div id="error" style="display:none;">
  <h2>⚠️ SYSTEM ERROR ⚠️</h2>
  <p>system failed i guess</p>
  <button class="option-btn" onclick="retryAsk()">restart system 💻</button>
</div>

<!-- STEP 1 -->
<div id="step1" style="display:none;">
  <h2>Pick a date 🗓️</h2>
  <div class="calendar" id="calendar"></div>
  <p class="small">June 2026 💜</p>
</div>

<!-- STEP 2 -->
<div id="step2" style="display:none;">
  <h2>Pick an activity</h2>

<p>
  <a href="date_activities.pdf" target="_blank" class="details-link">
    View more details
  </a>
</p>


<button class="option-btn" onclick="pickActivity('Movie 🎬')">Movie 🎬</button>
<button class="option-btn" onclick="pickActivity('Theatre 🎭')">Theatre 🎭</button>
<button class="option-btn" onclick="pickActivity('Museum 🏛️')">Museum 🏛️</button>
<button class="option-btn" onclick="pickActivity('Painting 🎨')">Painting 🎨</button>

  
<input
  type="text" 
  id="customActivity" 
  placeholder="or type your own activity" 
  class="custom-input"
>

<button class="option-btn" onclick="useCustomActivity()">
  Use the activity you typed
</button>

</div>

<!-- STEP 3 -->
<div id="step3" style="display:none;">
  <h2>Your plan</h2>

  <div id="summary" class="summary-card"></div>

  <button class="option-btn" onclick="goBackToActivity()">⬅️ Change activity</button>
  <button class="option-btn" onclick="goBackToCalendar()">📅 Change date</button>
  <button class="option-btn" onclick="finalYes()">DONE</button>
</div>

<!-- FINAL -->
<div id="celebration" style="display:none;">
  <h2>YAY I'M EXCOITEDDD, SEE YOU THEN!</h2>
  <div class="dance-avatar">🥳🥳🥳</div>
</div>

</div>

<script>
let retryCount = 0;
let chosenDate = "";
let chosenActivity = "";

/* FIRST YES */
function sayYes() {
  document.getElementById("start").style.display = "none";
  document.getElementById("earlyCelebrate").style.display = "block";

  confetti({ particleCount: 120, spread: 80 });

  document.body.classList.add("shake");
  setTimeout(() => document.body.classList.remove("shake"), 500);
}

/* CONTINUE */
function continueGame() {
  document.getElementById("earlyCelebrate").style.display = "none";
  document.getElementById("step1").style.display = "block";
  generateCalendar();
}

/* NO */
function sayNo() {
  document.body.classList.add("error-mode");
  document.getElementById("start").style.display = "none";
  document.getElementById("error").style.display = "block";
}

/* RETRY */
function retryAsk() {
  retryCount++;

  document.body.classList.remove("error-mode");
  document.getElementById("error").style.display = "none";
  document.getElementById("start").style.display = "block";

  // 💬 messages
  if (retryCount === 1) {
    document.querySelector("#start p").innerText =
      "Wait… system recovered 🥺 try again?";
  } else if (retryCount === 2) {
    document.querySelector("#start p").innerText =
      "okay I am politely begging 🧎‍♀️";
  } else {
    document.querySelector("#start p").innerText =
      "final attempt… I will be okay with anything 😭";
  }

  // 💜 grow YES
  let yesBtn = document.getElementById("yesBtn");
  yesBtn.style.transform = `scale(${1 + retryCount * 0.2})`;
  yesBtn.style.fontSize = `${16 + retryCount * 2}px`;

  let noBtn = document.getElementById("noBtn");

  if (retryCount <= 2) {
    noBtn.style.transform = `scale(${1 - retryCount * 0.1})`;
  } else {
    noBtn.style.display = "none";

    if (!document.getElementById("noGoneMsg")) {
      let msg = document.createElement("p");
      msg.id = "noGoneMsg";
      msg.innerText = "BUT IDK WHERE THE NO BUTTON WENT";
      msg.style.color = "#8b5cf6";
      msg.style.fontWeight = "bold";
      document.getElementById("start").appendChild(msg);
    }
  }
}

/* CALENDAR */
function generateCalendar() {
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const days = 30;
  const startDay = 1;

  for (let i = 0; i < startDay; i++) {
    let empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
  }

  for (let d = 1; d <= days; d++) {
    let day = document.createElement("div");
    day.className = "day";
    day.innerText = d;

    day.onclick = () => {
      document.querySelectorAll(".day")
        .forEach(el => el.classList.remove("selected"));

      day.classList.add("selected");
      pickDate(`June ${d}, 2026`);
    };

    calendar.appendChild(day);
  }
}

function pickDate(date) {
  chosenDate = date;
  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
}

/* ACTIVITY */
function pickActivity(act) {
  chosenActivity = act;

  document.getElementById("step2").style.display = "none";
  document.getElementById("step3").style.display = "block";

  document.getElementById("summary").innerHTML = `
    <div class="summary-item">
      <span class="summary-icon">📅</span>
      <span><span class="summary-title">Date:</span> ${chosenDate}</span>
    </div>

    <div class="summary-item">
      <span class="summary-icon">🎀</span>
      <span><span class="summary-title">Activity:</span> ${chosenActivity}</span>
    </div>

  `;
}
``

/* FINAL */
function finalYes() {
  document.getElementById("step3").style.display = "none";
  document.getElementById("celebration").style.display = "block";

  confetti({ particleCount: 150, spread: 100 });

  document.body.classList.add("shake");
  setTimeout(() => document.body.classList.remove("shake"), 500);
}


function goBackToActivity() {
  document.getElementById("step3").style.display = "none";
  document.getElementById("step2").style.display = "block";
}

function goBackToCalendar() {
  document.getElementById("step3").style.display = "none";
  document.getElementById("step1").style.display = "block";
}
function useCustomActivity() {
  let input = document.getElementById("customActivity").value.trim();

  if (input !== "") {
    pickActivity(input);
  }
}


</script>

</body>
</html>
